[package]
name = "engine-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
hot-reload = ["dep:engine-scene", "engine-render/shader-reload"]
physics = ["dep:engine-physics"]

[dependencies]
engine-asset.workspace = true
engine-core.workspace = true
engine-ecs.workspace = true
engine-physics = { workspace = true, optional = true }
engine-platform.workspace = true
engine-render.workspace = true
engine-scene = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[[example]]
name = "clear_window_android"
crate-type = ["cdylib"]

[[example]]
name = "hot_reload"
required-features = ["hot-reload"]

[[example]]
name = "deflection_arena"
required-features = ["physics"]
test = true
