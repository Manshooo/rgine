[package]
name = "engine-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
hot-reload = ["dep:engine-scene", "dep:ron", "engine-render/shader-reload"]
physics = ["dep:engine-physics"]
ui = ["dep:engine-ui"]

[dependencies]
engine-asset.workspace = true
engine-core.workspace = true
engine-ecs.workspace = true
engine-physics = { workspace = true, optional = true }
engine-platform.workspace = true
engine-render.workspace = true
engine-scene = { workspace = true, optional = true }
engine-ui = { workspace = true, features = ["canvas", "input"], optional = true }
ron = { version = "0.10", optional = true }
serde.workspace = true

[dev-dependencies]
engine-ui = { workspace = true, features = ["canvas"] }
ron = "0.10"
serde_json.workspace = true
tempfile = "3"

[[example]]
name = "clear_window_android"
crate-type = ["cdylib"]

[[example]]
name = "hot_reload"
required-features = ["hot-reload"]

[[example]]
name = "ui_overlay"
required-features = ["hot-reload", "ui"]
test = true

[[example]]
name = "deflection_arena"
required-features = ["physics"]
test = true
