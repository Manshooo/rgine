[package]
name = "engine-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
shader-reload = []

[dependencies]
engine-asset.workspace = true
engine-core.workspace = true
engine-platform.workspace = true
tracing.workspace = true
pollster = "0.4"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl"] }

[dev-dependencies]
tempfile = "3"
wgpu = { version = "30.0.2", default-features = false, features = ["noop"] }
