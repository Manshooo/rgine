[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/core-macros",
    "crates/ecs",
    "crates/ecs-macros",
    "crates/platform",
    "crates/render",
    "crates/physics",
    "crates/audio",
    "crates/asset",
    "crates/scene",
    "crates/script",
    "crates/ui",
    "crates/devtools",
    "crates/app",
    "crates/engine-cli",
    "apps/launcher",
    "apps/editor",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/Manshooo/rgine"

[workspace.dependencies]
# Engine crates depend on each other through these entries rather than by bare
# path, so the version they will be published under is written in one place and
# a release bumps it once. A path dependency without a version reads as a
# wildcard requirement, which `cargo deny` rejects for a publishable crate.
engine-core = { path = "crates/core", version = "0.1.0" }
engine-core-macros = { path = "crates/core-macros", version = "=0.1.0" }
engine-ecs = { path = "crates/ecs", version = "0.1.0" }
engine-ecs-macros = { path = "crates/ecs-macros", version = "=0.1.0" }
engine-platform = { path = "crates/platform", version = "0.1.0" }
engine-render = { path = "crates/render", version = "0.1.0" }
engine-physics = { path = "crates/physics", version = "0.1.0" }
engine-app = { path = "crates/app", version = "0.1.0" }
engine-asset = { path = "crates/asset", version = "0.1.0" }
engine-scene = { path = "crates/scene", version = "0.1.0" }
engine-ui = { path = "crates/ui", version = "0.1.0" }

glam = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
winit = "0.30"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = "1"
quote = "1"
syn = "2"
